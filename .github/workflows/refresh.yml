name: Refresh verified prices
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: price-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_market.py' -v
      - run: python -m unittest discover -s tests -p 'test_pipeline.py' -v
      - run: python -m unittest discover -s tests -p 'test_feed.py' -v
      - run: python -m unittest discover -s tests -p 'test_international.py' -v
      - run: python -m price_index.refresh
        id: collect
        continue-on-error: true
      - run: python -m scripts.validate
      - name: Commit validated data only
        run: |
          if ! git diff --quiet -- data/global-phones.json data/status.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/global-phones.json data/status.json
            git commit -m 'Update verified price index and source status'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-status
          path: data/status.json
          retention-days: 14
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
