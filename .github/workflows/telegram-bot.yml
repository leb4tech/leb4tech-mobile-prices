name: Deploy Telegram price bot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-bot-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check required configuration without printing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const names=['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','TELEGRAM_BOT_TOKEN','OPENAI_API_KEY','BOT_GITHUB_TOKEN'];
          const missing=names.filter(k=>!process.env[k]);
          if(missing.length){console.error('Missing repository secrets: '+missing.join(', '));process.exit(1);}
          const {createHmac}=await import('node:crypto');
          const {appendFileSync}=await import('node:fs');
          const secret=process.env.TELEGRAM_WEBHOOK_SECRET || createHmac('sha256',process.env.TELEGRAM_BOT_TOKEN).update('Leb4TechWebhook/v1').digest('hex');
          if(!/^[A-Za-z0-9_-]{32,256}$/.test(secret)){console.error('Invalid webhook secret format.');process.exit(1);}
          console.log('::add-mask::'+secret);
          appendFileSync(process.env.GITHUB_ENV,'TELEGRAM_WEBHOOK_SECRET='+secret+'\n');
          JS
      - run: npm ci
        working-directory: services/telegram-bot
      - run: npm test
        working-directory: services/telegram-bot
      - name: Deploy private bot service
        id: worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.152.0'
          workingDirectory: services/telegram-bot
          command: deploy
          secrets: |
            TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET
            TELEGRAM_OWNER_ID
            OPENAI_API_KEY
            GITHUB_TOKEN
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ env.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID || '0' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ env.TELEGRAM_WEBHOOK_SECRET }}
          BOT_WORKER_URL: ${{ steps.worker.outputs.deployment-url }}
        run: python services/telegram-bot/register_webhook.py
